<mtk-investor class="mtk-investor">
  <header class="mtk-investor__header" data-region="header">
    <div class="container">
      <div class="mtk-investor__chrome-inner">
        <div class="mtk-investor__mobile-toggle" data-region="header-toggle"></div>
        <div class="mtk-investor__chrome-brand" data-region="brand"></div>
        <nav class="mtk-investor__nav" data-region="navigation"></nav>
      </div>
    </div>
  </header>

  <main class="mtk-investor__main" data-region="main">
    <section class="mtk-investor__hero" data-region="hero"></section>
    <section class="mtk-investor__section" data-section="overview" data-region="overview"></section>
    <section class="mtk-investor__section mtk-investor__section--soft" data-section="highlights" data-region="metrics"></section>
    <section class="mtk-investor__principles" data-section="principles" data-region="principles"></section>
    <section class="mtk-investor__section" data-section="strategy" data-region="strategy"></section>
    <section class="mtk-investor__section mtk-investor__section--gold" data-region="highlights"></section>
    <section class="mtk-investor__section mtk-investor__section--soft" data-section="updates" data-region="updates"></section>
    <section class="mtk-investor__section mtk-investor__closing" data-region="closing"></section>
  </main>

  <footer class="mtk-investor__footer" data-region="footer"></footer>
  <div class="mtk-investor__to-top-region" data-region="to-top"></div>
  <div class="mtk-investor__status" data-region="status" aria-live="polite" aria-atomic="true"></div>
</mtk-investor>
